<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline · Training Ledger</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    background:#101113; color:#f2f3ef; font-family:system-ui,-apple-system,sans-serif; padding:24px; }
  .box { max-width:340px; text-align:center; }
  h1 { font-size:21px; margin:0 0 10px; font-weight:600; }
  p { color:#8d9490; line-height:1.6; font-size:14px; margin:0 0 18px; }
  button { background:#e5ff3d; color:#161a00; border:none; border-radius:8px;
    padding:11px 20px; font-weight:600; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>Training Ledger needs a connection to load your plan and save what you log. Your data is safe — nothing is lost.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
